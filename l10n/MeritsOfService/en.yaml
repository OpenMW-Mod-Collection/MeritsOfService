page_name: Merits of Service
page_description: |
  Get skills and attributes as additional rewards for completing faction quests. Rewards depend on factions.

  To get rewards retroactively, run "lua MeritMyService" command in the console.

meta_groupName: Meta Settings
settingsPreset_name: Settings Preset
settingsPreset_description: |
  LiNGeN -> Rewards granted each quest, but one at a time.

  Slow and Impactful -> Rewards granted every 3 quests, but in bigger chunks.
ncgInstalled_name: Natural Character Growth Installed
ncgInstalled_description: Adjust attribute rewards to make more sense with NCG's changes.

rewards_groupName: Rewards
questsPerReward_name: Quests per Stat Reward
skillRewardWeight_name: Skill Reward Weight
skillRewardWeight_desc: >
  For this setting to take effect, you'd need to reload lua scripts.
  Either run "reloadlua" in the console or restart the game.
attributeRewardWeight_name: Attribute Reward Weight
attributeRewardWeight_desc: >
  For this setting to take effect, you'd need to reload lua scripts.
  Either run "reloadlua" in the console or restart the game.

skills_groupName: Skill Rewards
minSkillReward_name: Min Skills Granted
maxSkillReward_name: Max Skills Granted
capSkills_name: Skill Rewards Cap
carrySkillXp_name: Carry Skill Xp
triggerSkillupHandlers_name: Skill Rewards Trigger Handlers
triggerSkillupHandlers_description: |
  If enabled, skill rewards will trigger all respective handlers (vanilla and modded). This includes contributing to character level and triggering similar things added by other mods.

  If disabled, skill rewards will just raise your base skill level, ignoring all logic which might usually trigger on skill level ups.

attributes_groupName: Attribute Rewards
minAttributeReward_name: Min Attributes Granted
maxAttributeReward_name: Max Attributes Granted
capAttr_name: Attribute Rewards Cap
luckRewardType_name: Luck Attribute Reward Type
luckRewardType_description: |
  Replace -> Luck has a chance to replace any other attribute reward.
  
  Bonus -> Luck is granted in addition to other attribute rewards.
luckRewardChance_name: Luck Attribute Reward Chance
